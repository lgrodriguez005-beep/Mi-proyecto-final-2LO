<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTech Hub - Convertidor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">FinTech Hub</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="conversor.html">Conversor</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg border-0 p-4">
                    <h2 class="text-center fw-bold mb-4">Calculadora de Divisas</h2>
                    <form id="conversor-form">
                        <div class="mb-3">
                            <label for="monto" class="form-label font-weight-bold">Monto a convertir:</label>
                            <input type="number" id="monto" class="form-control form-control-lg" placeholder="100.00" value="100" min="1" step="any" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6 mb-2">
                                <label for="origen" class="form-label">De (Origen):</label>
                                <select id="origen" class="form-select">
                                    <option value="USD" selected>USD - Dólar US</option>
                                    <option value="EUR">EUR - Euro</option>
                                    <option value="MXN">MXN - Peso MX</option>
                                    <option value="GBP">GBP - Libra</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-2">
                                <label for="destino" class="form-label">A (Destino):</label>
                                <select id="destino" class="form-select">
                                    <option value="MXN" selected>MXN - Peso MX</option>
                                    <option value="USD">USD - Dólar US</option>
                                    <option value="EUR">EUR - Euro</option>
                                    <option value="GBP">GBP - Libra</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Calcular Conversión</button>
                    </form>

                    <div id="resultado-container" class="mt-4 text-center d-none">
                        <div class="p-3 bg-light rounded border">
                            <h5 class="text-muted">Resultado:</h5>
                            <h2 id="resultado-texto" class="display-5 fw-bold text-success my-2">0.00</h2>
                            <small id="timestamp" class="text-muted"></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">Escuela Bancaria y Comercial (EBC) | Luis Gerardo Fuentes Cobos</p>
    </footer>

    <script src="conversor.js"></script>
</body>
</html>
